name: CI

on:
  push:
    branches: [migration/csharp-wpf]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows C# tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: _internal/dotnet/global.json
      - name: Set up Python tools
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'
      - name: Audit source and documentation
        run: |
          python -B _development/tools/audit_repository.py --worktree
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B _development/tools/check_documentation.py
      - name: Verify portable tools
        run: python -B -m unittest discover -s _development/tests/resources -p "test_*.py"
      - name: Restore reviewed resources
        run: python -B _development/tools/prepare_resources.py --offline
      - name: C# contracts and fixed differential suites
        run: '& _internal/dotnet/Verify.ps1'
      - name: Navigation without desktop windows
        run: dotnet _internal/dotnet/Desktop/bin/Debug/net10.0-windows10.0.19041.0/EndfieldLogs-Enhanced.dll --check-navigation _development/verification/dotnet/navigation.json
      - name: Product pages without desktop windows
        run: dotnet _internal/dotnet/Desktop/bin/Debug/net10.0-windows10.0.19041.0/EndfieldLogs-Enhanced.dll --check-pages _development/verification/dotnet/pages.json
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}
          path: _development/verification/dotnet/
          if-no-files-found: ignore
          retention-days: 14
