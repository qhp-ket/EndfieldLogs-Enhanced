name: CI

on:
  push:
    branches: [main/python-qt, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: |
            _development/environment/requirements-*.txt
            _development/environment/constraints-ci.txt
            _development/portable/runtime-requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r _development/environment/requirements-dev.txt -c _development/environment/constraints-ci.txt
      - name: Prepare runtime data
        run: python -B _development/tools/prepare_resources.py --offline
      - name: Audit repository
        run: python -B _development/tools/audit_repository.py --worktree
      - name: Application tests
        run: python -B _development/run_tests.py live
      - name: Parser core tests
        if: success() || failure()
        run: python -B _development/run_tests.py parser_core
      - name: Uploader core tests
        if: success() || failure()
        run: python -B _development/run_tests.py uploader_core
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}
          path: |
            _development/verification/*-tests.txt
            _development/verification/*-junit.xml
          if-no-files-found: ignore
          retention-days: 14
