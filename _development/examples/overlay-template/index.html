<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  :root { font-size: calc(16px * var(--overlay-font-scale, 1)); }
  body { margin: 0; padding: 1rem; color: #feef00; background: #202020; font: 1rem "Segoe UI", sans-serif; }
  #value { color: white; font-size: 2.5rem; font-weight: bold; }
  #source { color: #ddd; font-size: .8rem; }
</style>
<div id="title">团队 DMG</div>
<div id="value">—</div>
<div id="source">等待快照</div>
<script>
  let message = null;
  let settings = {metric: "total_damage"};
  function render() {
    document.querySelector("#title").textContent = settings.metric === "total_dps" ? "团队 DPS" : "团队 DMG";
    const value = message?.snapshot?.battle?.[settings.metric];
    document.querySelector("#value").textContent = typeof value === "number" ? value.toLocaleString(undefined, {maximumFractionDigits: 1}) : "—";
    document.querySelector("#source").textContent = message?.source?.mode === "history" ? `历史 · ${message.source.label || "已加载"}` : "实时";
  }
  window.addEventListener("endfield-overlay-config", event => {
    settings = event.detail.settings;
    render();
  });
  window.addEventListener("endfield-analysis-snapshot", event => {
    message = event.detail; // Complete replacement. Never accumulate damage.
    render();
  });
</script>
</html>
