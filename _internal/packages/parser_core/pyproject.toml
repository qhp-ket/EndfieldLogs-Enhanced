[project]
name = "parser-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
